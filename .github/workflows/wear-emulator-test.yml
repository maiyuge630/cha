name: Wear OS Emulator Tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and APK build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify APK does not request INTERNET permission
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if unzip -p "$APK" AndroidManifest.xml 2>/dev/null | strings | grep -q 'android.permission.INTERNET'; then
            echo 'Unexpected INTERNET permission found'
            exit 1
          fi

  wear-os:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Wear OS 5.1 / API 35
            api_level: 35
            system_image: 35-ext15
          - label: Wear OS 6 / API 36
            api_level: 36
            system_image: 36
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run UI tests on ${{ matrix.label }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api_level }}
          system-image-api-level: ${{ matrix.system_image }}
          target: android-wear
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace
