name: Build PayPal Receiver APKs

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build phone and watch APKs
        run: gradle :receiver-mobile:assembleDebug :receiver-wear:assembleDebug --stacktrace
      - name: Upload receiver pair
        uses: actions/upload-artifact@v4
        with:
          name: PayPalReceiver-v0.1.0-phone-and-watch
          path: |
            receiver-mobile/build/outputs/apk/debug/receiver-mobile-debug.apk
            receiver-wear/build/outputs/apk/debug/receiver-wear-debug.apk
          if-no-files-found: error
